<main class="hurricane-draft flicker-draft" data-look="original" data-store="flicker" data-anchor="window">
<img class="storm" src="${root}static/images/flicker/s/001.jpg" data-base="${root}static/images/flicker/" alt="">

<nav class="h-links"><a href="#" data-panel="about">About</a><a href="#" data-panel="directory">Directory</a><a href="#" data-panel="writings">Featured Writings</a><a href="#" class="h-toggle" role="button" aria-pressed="false">Hide options</a></nav>

<p class="wordmark">non plus</p>

<div class="h-controls">
<p class="f-status"><label class="f-freeze"><input type="checkbox"> Hold this photo</label> · <output></output></p>
<label class="h-fade">Image opacity <input type="range" min="0" max="100" step="1" value="100" aria-label="Image opacity"> <output>100%</output></label>
<label class="h-font">Font <select aria-label="Font of “non plus”"></select></label>
<p class="h-pos">Drag “non plus” to move it · <output></output> · <button type="button">reset position</button></p>
<div class="h-words" role="group" aria-label="Colour of “non plus”"></div>
<p class="h-label">Links</p>
<div class="h-linkcolours" role="group" aria-label="Colour of the links"></div>
<div class="f-place" role="group" aria-label="Where the links go">
<span>Top</span><button type="button" data-place="top-left" aria-label="Links top left">left</button><button type="button" data-place="top-center" aria-label="Links top centre">centre</button><button type="button" data-place="top-right" aria-label="Links top right">right</button><button type="button" data-place="top-spread" aria-label="Links spread across the top">spread</button>
<span>Middle</span><button type="button" data-place="middle-left" aria-label="Links down the left edge">left</button><span></span><button type="button" data-place="middle-right" aria-label="Links down the right edge">right</button><span></span>
<span>Bottom</span><button type="button" data-place="bottom-left" aria-label="Links bottom left">left</button><button type="button" data-place="bottom-center" aria-label="Links bottom centre">centre</button><button type="button" data-place="bottom-right" aria-label="Links bottom right">right</button><button type="button" data-place="bottom-spread" aria-label="Links spread across the bottom">spread</button>
</div>
<p class="h-boxes">Box <button type="button" data-box="none">none</button><button type="button" data-box="outline">outline</button><button type="button" data-box="filled">filled</button></p>
<div class="h-boxcolours" role="group" aria-label="Colour of the box"></div>
<label class="h-boxfade">Box opacity <input type="range" min="0" max="100" step="1" value="100" aria-label="Box opacity"> <output>100%</output></label>
<div class="h-looks" role="group" aria-label="Image colours"></div>
</div>

<!-- colour treatments for the photograph: each maps its dark tones to one colour and its light tones to another -->
<svg class="h-filters" width="0" height="0" aria-hidden="true"><defs></defs></svg>
</main>
$panels
